<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Presença confirmada · Heloísa 1 Aninho</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&display=swap">
<style>
:root{--ink:#1e2350;--sun:#ffd23f;--coral:#ff6b4a;--cobalt:#2f5bea;--green:#1fae57;--paper:#fffaf0;
  --f-display:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;--f-body:"Nunito","Segoe UI",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:#fff2dc}
body{font-family:var(--f-body);color:var(--ink);font-size:16px;line-height:1.5;display:flex;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));min-height:100vh}
.card{width:100%;max-width:460px;background:var(--paper);border:3px solid var(--ink);border-radius:28px;box-shadow:0 7px 0 var(--ink);padding:26px 22px 24px;text-align:center;position:relative;overflow:hidden}
.bow{display:block;margin:-8px auto 4px;width:200px;height:auto}
h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(28px,8vw,36px);line-height:1.1;text-wrap:balance}
h1 em{font-style:normal;color:var(--coral)}
.lead{margin:12px auto 0;max-width:32ch;font-weight:800;font-size:17px;text-wrap:balance}
.info{margin:16px 0 0;padding:12px;border:3px dashed var(--ink);border-radius:18px;background:#fff;font-weight:800}
.info b{font-family:var(--f-display);font-size:19px;display:block}
.btns{display:grid;gap:10px;margin-top:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:900;font-size:16px;color:#fff;background:var(--cobalt);
  border:3px solid var(--ink);border-radius:999px;padding:11px 16px;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.wa{background:var(--green)}.btn.sun{background:var(--sun);color:var(--ink)}
.btn:focus-visible{outline:4px solid var(--cobalt);outline-offset:2px}
.small{margin:6px 0 0;font-size:13.5px;font-weight:800;color:#4a4f7a}
.err{background:#fde3ea;border-color:#c23a5a}
</style>
</head><body>
<main class="card" id="card">
  <svg class="bow" viewBox="0 0 200 104" aria-hidden="true">
    <g fill="none" stroke-width="12">
      <path d="M12 100 A88 88 0 0 1 188 100" stroke="#1e2350" stroke-width="16"/>
      <path d="M14 100 A86 86 0 0 1 186 100" stroke="#ff5a5a"/>
      <path d="M26 100 A74 74 0 0 1 174 100" stroke="#ff9f1c"/>
      <path d="M38 100 A62 62 0 0 1 162 100" stroke="#ffd23f"/>
      <path d="M50 100 A50 50 0 0 1 150 100" stroke="#5ccb6b"/>
      <path d="M62 100 A38 38 0 0 1 138 100" stroke="#2f9df4"/>
      <path d="M74 100 A26 26 0 0 1 126 100" stroke="#7b5cf0"/>
    </g>
  </svg>
  <h1 id="title">Presença <em>confirmada!</em></h1>
  <p class="lead" id="lead">Obrigado! Sua resposta já está na lista da festa. 🎉</p>
  <div class="info" id="info"><b>Sábado, 09/01/2027 · 17h30</b>Salão Celebre · Av. Fagundes Varela, 218 · São João de Meriti</div>
  <div class="btns">
    <a class="btn sun" id="cal" target="_blank" rel="noopener" href="#">📅 Salvar na agenda</a>
    <a class="btn wa" id="wa" target="_blank" rel="noopener" href="https://wa.me/5521976558809">Avisar também no WhatsApp</a>
    <a class="btn" href="https://tinyurl.com/aninho-heloisa">Voltar ao convite</a>
  </div>
  <p class="small" id="small">O WhatsApp é opcional: sua presença já foi registrada.</p>
</main>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var nome=(q.get("n")||"").slice(0,80), vai=q.get("v")!=="0", erro=q.get("e")==="1", txt=q.get("t")||"";
  var $=function(id){return document.getElementById(id)};
  var first=nome.split(/\s+/)[0]||"";
  $("wa").href="https://wa.me/5521976558809"+(txt?"?text="+encodeURIComponent(txt):"");
  $("cal").href="https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("Aniversário de 1 aninho da Heloísa 🎂")
    +"&dates=20270109T203000Z/20270110T003000Z&location="+encodeURIComponent("Salão Celebre, Av. Fagundes Varela, 218, Vila São João, São João de Meriti - RJ");
  if(erro){
    $("card").classList.add("err");
    $("title").textContent="Quase lá!";
    $("lead").textContent="Não conseguimos registrar sua resposta agora. Toque no botão verde para confirmar pelo WhatsApp.";
    $("small").textContent="";
    $("cal").hidden=true;
    return;
  }
  if(!vai){
    $("title").innerHTML="Resposta <em>recebida</em>";
    $("lead").textContent=(first?first+", sentiremos":"Sentiremos")+" sua falta! Obrigado por avisar. 💛";
    $("cal").hidden=true; $("info").hidden=true;
    $("small").textContent="O WhatsApp é opcional: sua resposta já foi registrada.";
    return;
  }
  if(first) $("lead").textContent="Obrigado, "+first+"! Seu nome já está na lista da festa da Heloísa. 🎉";
})();
</script>
</body></html>
